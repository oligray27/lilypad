[package]
name = "lilypad-core"
version = "0.6.1"
description = "Shared Froglog API client, config, and process-monitor logic for Lilypad (Windows/Tauri and Linux/GTK)"
edition = "2021"
# 1.89: std::fs::File::lock/try_lock, used for the single-tracker lock (engine::lock).
rust-version = "1.89"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
dirs = "5"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# `wmi` was dropped with the Win32_ProcessStartTrace subscription: that event class is
# administrator-only, so it never worked in an unelevated install and the process scan was always
# doing the detection. See the module docs in monitor.rs.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    # OpenProcess/WaitForSingleObject, for waiting on a real SYNCHRONIZE handle rather than
    # inferring exit from process enumeration -- see monitor::wait_for_process_exit.
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
